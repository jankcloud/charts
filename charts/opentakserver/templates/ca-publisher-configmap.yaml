{{- if eq (include "opentakserver.caPublishEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opentakserver.fullname" . }}-ca-publisher
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
data:
  ca_publisher.py: |
    import base64
    import json
    import os
    import ssl
    import time
    import urllib.error
    import urllib.request

    CA_DIR = os.path.join(os.environ.get("OTS_DATA_FOLDER", "/app/ots"), "ca")
    SECRET = os.environ["OTS_CA_SECRET_NAME"]
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    NAMESPACE = open(os.path.join(SA_DIR, "namespace")).read().strip()
    API = "https://kubernetes.default.svc"
    CTX = ssl.create_default_context(cafile=os.path.join(SA_DIR, "ca.crt"))

    # Secret key -> file inside OTS_CA_FOLDER
    FILES = {
        "ca.pem": "ca.pem",
        "ca-trusted.pem": "ca-trusted.pem",
        "opentakserver.pem": "certs/opentakserver/opentakserver.pem",
        "opentakserver.nopass.key": "certs/opentakserver/opentakserver.nopass.key",
    }
    REQUIRED = ("ca.pem", "opentakserver.pem", "opentakserver.nopass.key")


    def collect():
        data = {}
        for key, rel in FILES.items():
            try:
                with open(os.path.join(CA_DIR, rel), "rb") as f:
                    data[key] = base64.b64encode(f.read()).decode()
            except OSError:
                pass
        return data


    def request(method, url, body):
        # Re-read the token each call: bound service-account tokens rotate.
        token = open(os.path.join(SA_DIR, "token")).read().strip()
        req = urllib.request.Request(
            url,
            method=method,
            data=json.dumps(body).encode(),
            headers={
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json",
            },
        )
        return urllib.request.urlopen(req, context=CTX, timeout=15)


    def publish(data):
        body = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": data,
        }
        try:
            request("PUT", f"{API}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET}", body)
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            request("POST", f"{API}/api/v1/namespaces/{NAMESPACE}/secrets", body)


    last = None
    while True:
        data = collect()
        if all(k in data for k in REQUIRED) and data != last:
            try:
                publish(data)
                last = data
            except Exception as e:
                print(f"failed to publish {SECRET}: {e}", flush=True)
        time.sleep(15)
{{- end }}
