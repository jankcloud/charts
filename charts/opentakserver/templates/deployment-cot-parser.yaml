{{- if .Values.cotParser.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opentakserver.cotParserName" . }}
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: cot-parser
spec:
  {{- if not .Values.cotParser.autoscaling.enabled }}
  replicas: {{ .Values.cotParser.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "opentakserver.cotParserSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.cotParser.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "opentakserver.labels" . | nindent 8 }}
        app.kubernetes.io/component: cot-parser
        {{- with .Values.cotParser.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opentakserver.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cot-parser
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - cot_parser
          env:
            - name: OTS_COT_PARSER_PROCESSES
              value: {{ .Values.cotParser.processes | quote }}
            - name: OTS_RABBITMQ_PREFETCH
              value: {{ .Values.cotParser.prefetch | quote }}
            {{- include "opentakserver.env" . | nindent 12 }}
            {{- with .Values.cotParser.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.cotParser.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cotParser.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cotParser.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cotParser.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ots-data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- with .Values.cotParser.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: ots-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "opentakserver.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.cotParser.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.cotParser.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cotParser.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cotParser.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
