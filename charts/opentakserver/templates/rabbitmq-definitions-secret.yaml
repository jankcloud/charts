{{- if .Values.rabbitmq.enabled }}
{{- $vhost := .Values.rabbitmq.auth.vhost | default "/" -}}
{{- $username := include "opentakserver.rabbitmqUsername" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opentakserver.rabbitmqDefinitionsName" . }}
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
type: Opaque
stringData:
  definitions.json: |
    {
      "vhosts": [
        {"name": {{ $vhost | quote }}}
      ],
      {{- /*
      RabbitMQ skips RABBITMQ_DEFAULT_USER seeding when load_definitions is
      configured, so the OTS user must be declared here. With
      auth.existingSecret the broker password is unknown at render time and
      the user cannot be seeded — provision it via the operator's own
      definitions Secret instead.
      */}}
      {{- if not .Values.rabbitmq.auth.existingSecret }}
      "users": [
        {"name": {{ $username | quote }}, "password": {{ include "opentakserver.rabbitmqPassword" . | quote }}, "tags": "administrator"}
      ],
      "permissions": [
        {"user": {{ $username | quote }}, "vhost": {{ $vhost | quote }}, "configure": ".*", "write": ".*", "read": ".*"}
      ],
      {{- else }}
      "users": [],
      {{- end }}
      "exchanges": [
        {"name": "dms", "vhost": {{ $vhost | quote }}, "type": "direct", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
        {"name": "cot_parser", "vhost": {{ $vhost | quote }}, "type": "direct", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
        {"name": "chatrooms", "vhost": {{ $vhost | quote }}, "type": "direct", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
        {"name": "missions", "vhost": {{ $vhost | quote }}, "type": "topic", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
        {"name": "groups", "vhost": {{ $vhost | quote }}, "type": "topic", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
        {"name": "firehose", "vhost": {{ $vhost | quote }}, "type": "fanout", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
        {"name": "flask-socketio", "vhost": {{ $vhost | quote }}, "type": "fanout", "durable": false, "auto_delete": false, "internal": false, "arguments": {}}
      ]
    }
{{- end }}
