{{- if eq (include "opentakserver.caPublishEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opentakserver.fullname" . }}-ca-publisher
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "opentakserver.caSecretName" . | quote }}]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opentakserver.fullname" . }}-ca-publisher
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opentakserver.fullname" . }}-ca-publisher
subjects:
  - kind: ServiceAccount
    name: {{ include "opentakserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
