{{- if and .Values.ui.enabled .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opentakserver.uiNginxConfigName" . }}
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 100M;

        # API + Marti API go to the OpenTAKServer web backend.
        location ~ ^/(api|Marti) {
            proxy_pass http://{{ include "opentakserver.webServiceName" . }}:{{ .Values.web.service.ports.api.port | default 8081 }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask-SocketIO websocket traffic.
        location /socket.io {
            proxy_pass http://{{ include "opentakserver.webServiceName" . }}:{{ .Values.web.service.ports.api.port | default 8081 }}/socket.io;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Single-page app fallback.
        location / {
            try_files $uri /index.html;
        }
    }
{{- end }}
