{{- if and .Values.ui.enabled .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opentakserver.uiNginxConfigName" . }}
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 100M;

        # API + Marti API go to the OpenTAKServer web backend.
        location ~ ^/(api|Marti) {
            proxy_pass http://{{ include "opentakserver.webServiceName" . }}:{{ .Values.web.service.ports.api.port | default 8081 }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask-SocketIO websocket traffic.
        location /socket.io {
            proxy_pass http://{{ include "opentakserver.webServiceName" . }}:{{ .Values.web.service.ports.api.port | default 8081 }}/socket.io;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        {{- if .Values.mediamtx.enabled }}
        # Proxy WebRTC requests to MediaMTX.
        location ~ ^/webrtc(/?)(.*)$ {
            proxy_pass https://{{ include "opentakserver.mediamtxServiceName" . }}:{{ .Values.mediamtx.service.ports.webrtc.port }}/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy HLS requests to MediaMTX.
        location ~ ^/hls(/?)(.*)$ {
            proxy_pass https://{{ include "opentakserver.mediamtxServiceName" . }}:{{ .Values.mediamtx.service.ports.hls.port }}/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        {{- end }}

        # Single-page app fallback.
        location / {
            try_files $uri /index.html;
        }
    }

    {{- if .Values.ui.enrollment.enabled }}
    # TLS endpoint for automatic certificate enrollment (iTAK/ATAK).
    server {
        listen 8446 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ots-ca/opentakserver.pem;
        ssl_certificate_key /etc/nginx/ots-ca/opentakserver.nopass.key;

        location /Marti/api/tls {
            proxy_pass http://{{ include "opentakserver.webServiceName" . }}:{{ .Values.web.service.ports.api.port | default 8081 }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /oauth {
            proxy_pass http://{{ include "opentakserver.webServiceName" . }}:{{ .Values.web.service.ports.api.port | default 8081 }};
            proxy_http_version 1.1;
            proxy_set_header Host $host:443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Ssl-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    {{- end }}
{{- end }}
