suite: Deployment (eud-handler)
templates:
  - templates/deployment-eud-handler.yaml
tests:

  - it: renders a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-eud-handler
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/app/venv/bin/eud_handler"]

  - it: wraps the primary command with a CA wait when mode is ssl
    set:
      eudHandler.mode: ssl
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: "/bin/sh"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'exec /app/venv/bin/eud_handler --ssl$'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ots-ca
            mountPath: /app/ots/ca
            readOnly: true

  - it: adds an eud_handler --ssl sidecar by default
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: eud-handler-ssl
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: 'exec /app/venv/bin/eud_handler --ssl$'
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 8089
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ots-ca
            secret:
              secretName: RELEASE-NAME-opentakserver-ots-ca
              optional: true
              items:
                - key: ca.pem
                  path: ca.pem
                - key: ca-trusted.pem
                  path: ca-trusted.pem
                - key: opentakserver.pem
                  path: certs/opentakserver/opentakserver.pem
                - key: opentakserver.nopass.key
                  path: certs/opentakserver/opentakserver.nopass.key

  - it: skips the ssl sidecar when ssl.enabled is false
    set:
      eudHandler.ssl.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[1]
      - notExists:
          path: spec.template.spec.volumes[1]

  - it: adds --udp when mode is udp
    set:
      eudHandler.mode: udp
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/app/venv/bin/eud_handler", "--udp"]

  - it: uses the shared chart-managed service account by default
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-opentakserver

  - it: honors a per-component serviceAccountName override
    set:
      eudHandler.serviceAccountName: eud-handler-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: eud-handler-sa

  - it: falls back to the chart-wide podSecurityContext by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  - it: honors a per-component podSecurityContext override
    set:
      eudHandler.podSecurityContext:
        runAsUser: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 2000

  - it: does not render a startupProbe by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: renders a startupProbe when enabled
    set:
      eudHandler.startupProbe.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: tcp

  - it: mounts the data PVC when persistence is enabled
    set:
      persistence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ots-data
            persistentVolumeClaim:
              claimName: RELEASE-NAME-opentakserver-data
