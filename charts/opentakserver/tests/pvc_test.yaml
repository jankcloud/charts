suite: PVC
templates:
  - templates/pvc.yaml
tests:

  - it: renders a PVC when persistence is enabled
    set:
      persistence.enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-data
      - equal:
          path: spec.resources.requests.storage
          value: 8Gi

  - it: does not render a PVC by default
    asserts:
      - hasDocuments:
          count: 0
