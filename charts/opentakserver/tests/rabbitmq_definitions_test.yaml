suite: RabbitMQ definitions
templates:
  - templates/rabbitmq-definitions-secret.yaml
tests:

  - it: renders broker definitions when bundled RabbitMQ is enabled
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-rabbitmq-definitions
      - matchRegex:
          path: stringData["definitions.json"]
          pattern: '"vhosts"'
      - matchRegex:
          path: stringData["definitions.json"]
          pattern: '"name": "ots"'
      - matchRegex:
          path: stringData["definitions.json"]
          pattern: '"user": "ots"'
      - matchRegex:
          path: stringData["definitions.json"]
          pattern: '"name": "cot_parser"'
      - matchRegex:
          path: stringData["definitions.json"]
          pattern: '"name": "groups"'

  - it: omits seeded credentials when auth.existingSecret is set
    set:
      rabbitmq.auth.existingSecret: my-rabbitmq-secret
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["definitions.json"]
          pattern: '"users": \[\]'
      - notMatchRegex:
          path: stringData["definitions.json"]
          pattern: '"password"'

  - it: skips broker definitions when bundled RabbitMQ is disabled
    set:
      rabbitmq.enabled: false
    asserts:
      - hasDocuments:
          count: 0
