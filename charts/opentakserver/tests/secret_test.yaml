suite: Secret
templates:
  - templates/secret.yaml
tests:

  - it: renders a chart-managed secret for external RabbitMQ credentials
    set:
      rabbitmq.enabled: false
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-secret
      - equal:
          path: stringData["rabbitmq-password"]
          value: guest
      - notExists:
          path: stringData.vhost
      - notExists:
          path: stringData.username
      - notExists:
          path: stringData.host

  - it: renders a chart-managed secret for external database credentials
    set:
      postgresql.enabled: false
      database.host: db.example.internal
      database.password: s3cret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-secret
      - equal:
          path: stringData["db-password"]
          value: s3cret

  - it: renders one secret with both credentials when both are external
    set:
      postgresql.enabled: false
      rabbitmq.enabled: false
      database.host: db.example.internal
      database.password: s3cret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["db-password"]
          value: s3cret
      - equal:
          path: stringData["rabbitmq-password"]
          value: guest

  - it: does not render a secret when RabbitMQ is bundled
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render a secret when an existing secret is used
    set:
      rabbitmq.enabled: false
      rabbitmq.external.existingSecret.name: my-rabbitmq-secret
    asserts:
      - hasDocuments:
          count: 0
