suite: Secret
templates:
  - templates/secret.yaml
tests:

  - it: renders a chart-managed secret for external RabbitMQ credentials
    set:
      rabbitmq.enabled: false
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-secret
      - equal:
          path: stringData.username
          value: guest
      - equal:
          path: stringData.password
          value: guest
      - equal:
          path: stringData.vhost
          value: /

  - it: does not render a secret when RabbitMQ is bundled
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render a secret when an existing secret is used
    set:
      rabbitmq.enabled: false
      rabbitmq.external.existingSecret.name: my-rabbitmq-secret
    asserts:
      - hasDocuments:
          count: 0
