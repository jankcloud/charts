suite: Service
templates:
  - templates/service.yaml
tests:

  - it: renders three services by default
    asserts:
      - hasDocuments:
          count: 3

  - it: renders the UI service
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-ui
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: api

  - it: renders the API service
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-api
      - equal:
          path: spec.ports[0].port
          value: 8081
      - equal:
          path: spec.ports[0].targetPort
          value: api

  - it: renders the CoT service
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-cots
      - equal:
          path: spec.ports[0].port
          value: 8088
      - equal:
          path: spec.ports[1].port
          value: 8089
