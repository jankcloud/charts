suite: UI nginx ConfigMap
templates:
  - templates/ui-nginx-configmap.yaml
tests:

  - it: renders the nginx server config by default
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentakserver-ui-nginx
      - matchRegex:
          path: data["default.conf"]
          pattern: 'proxy_pass http://RELEASE-NAME-opentakserver-web:8081'
      - matchRegex:
          path: data["default.conf"]
          pattern: 'location /socket\.io'
      - matchRegex:
          path: data["default.conf"]
          pattern: 'try_files \$uri /index\.html'

  - it: skips the ConfigMap when ui is disabled
    set:
      ui.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the ConfigMap when web is disabled
    set:
      web.enabled: false
    asserts:
      - hasDocuments:
          count: 0
