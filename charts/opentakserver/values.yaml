# yaml-language-server: $schema=values.schema.json
image:
  repository: ghcr.io/brian7704/opentakserver
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Chart-wide defaults. Each of web/eudHandler/cotParser below can override
# serviceAccountName, podSecurityContext, securityContext and
# imagePullSecrets individually; an empty override falls back to these
# defaults so every deployment has the same level of configurability.
#
# The OpenTAKServer image runs as the `ots` user (UID 1000, GID 1024) and
# keeps the venv in /app (mode 0700, owned by ots). These values must match
# that user or the containers will fail to exec the OTS binaries.
podSecurityContext:
  fsGroup: 1024
  runAsUser: 1000
  runAsGroup: 1024
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1024
  capabilities:
    drop:
      - ALL

# OTS connection wiring shared by all three components. These are
# infrastructure-level settings (ports, data dir, interfaces), not
# per-component tuning.
env:
  OTS_DATA_FOLDER: /app/ots
  OTS_LISTENER_ADDRESS: 0.0.0.0
  OTS_LISTENER_PORT: "8081"
  OTS_STREAMING_INTERFACE: 0.0.0.0
  OTS_TCP_STREAMING_PORT: "8088"
  OTS_SSL_STREAMING_PORT: "8089"
  OTS_UDP_PORT: "8087"

# Web component: the main `opentakserver` binary serving UI + API on 8081.
web:
  enabled: true
  replicaCount: 1
  # Overrides for the chart-wide defaults above. Empty/unset falls back to
  # the top-level serviceAccount/podSecurityContext/securityContext/imagePullSecrets.
  serviceAccountName: ""
  podSecurityContext: {}
  securityContext: {}
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  envFrom: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /api/health
      port: api
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /api/health
      port: api
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  startupProbe:
    enabled: false
    httpGet:
      path: /api/health
      port: api
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
    ports:
      api:
        port: 8081
        targetPort: api

# UI component: nginx serving the OpenTAKServer-UI single-page app on
# port 80, proxying /api, /Marti and /socket.io to the web service. This
# is a separate image (ghcr.io/brian7704/opentakserver-ui), so it does
# not share the chart-wide image or the OTS non-root security defaults.
ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/brian7704/opentakserver-ui
    tag: master
    pullPolicy: IfNotPresent
  # Empty/unset serviceAccountName and imagePullSecrets fall back to the
  # chart-wide defaults. podSecurityContext/securityContext stay empty by
  # default: stock nginx must run its master process as root.
  serviceAccountName: ""
  podSecurityContext: {}
  securityContext: {}
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  envFrom: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  startupProbe:
    enabled: false
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
    ports:
      http:
        port: 8080
        targetPort: http
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# EUD handler component: `eud_handler` binary accepting CoT streams.
eudHandler:
  enabled: true
  replicaCount: 1
  # One of: tcp, ssl, udp. Maps to the eud_handler --ssl/--udp flags.
  mode: tcp
  # Overrides for the chart-wide defaults above. Empty/unset falls back to
  # the top-level serviceAccount/podSecurityContext/securityContext/imagePullSecrets.
  serviceAccountName: ""
  podSecurityContext: {}
  securityContext: {}
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  envFrom: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    tcpSocket:
      port: tcp
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    tcpSocket:
      port: tcp
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  startupProbe:
    enabled: false
    tcpSocket:
      port: tcp
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 30
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
    ports:
      tcp:
        enabled: true
        port: 8088
        targetPort: tcp
      ssl:
        enabled: true
        port: 8089
        targetPort: ssl
      udp:
        enabled: false
        port: 8087
        targetPort: udp

# CoT parser component: `cot_parser` binary consuming the cot_parser queue.
cotParser:
  enabled: true
  replicaCount: 1
  # Additional worker processes forked inside each pod.
  processes: 1
  # RabbitMQ consumer prefetch count.
  prefetch: 1
  # Overrides for the chart-wide defaults above. Empty/unset falls back to
  # the top-level serviceAccount/podSecurityContext/securityContext/imagePullSecrets.
  serviceAccountName: ""
  podSecurityContext: {}
  securityContext: {}
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  envFrom: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f cot_parser >/dev/null
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f cot_parser >/dev/null
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  startupProbe:
    enabled: false
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f cot_parser >/dev/null
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 30

# Optional PVC for the OTS data folder (SQLite DB, config.yml, data
# packages, certs). Disabled by default for a minimal ephemeral install.
persistence:
  enabled: false
  existingClaim: ""
  mountPath: /app/ots
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  storageClass: ""

database:
  # Fully-formed SQLAlchemy URI. Takes precedence over everything else.
  uri: ""
  # Credentials/host from an externally managed Secret (CNPG, MariaDB
  # operator, sealed-secrets, etc.). When set, keys inside the secret are
  # referenced instead of the values below.
  existingSecret:
    name: ""
    keys:
      uri: uri
      host: host
      port: port
      database: database
      username: username
      password: password
  host: ""
  port: ""
  database: ""
  username: ""
  password: ""

# Bundled PostgreSQL. Enabled by default so a basic install gets a shared
# database for all three components without any extra values. Set
# postgresql.enabled=false and configure the `database` block above for
# external databases (CNPG, MariaDB operator, cloud RDS, etc.).
postgresql:
  enabled: true
  auth:
    username: ots
    password: ots
    database: ots
    existingSecret: ""
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password
  primary:
    persistence:
      enabled: false
      size: 8Gi

rabbitmq:
  enabled: true
  architecture: single-node
  auth:
    username: ots
    password: ots
    vhost: /
    existingSecret: ""
    existingSecretUsernameKey: rabbitmq-username
    existingSecretPasswordKey: rabbitmq-password
    existingSecretErlangCookieKey: rabbitmq-erlang-cookie
  queueDefaults:
    type: classic
  # Match the upstream installer's broker setup: MQTT for EUDs on 1883,
  # with device auth delegated to the OTS API (auth_http -> web service).
  # The auth_http URLs must point at "<release fullname>-web" on
  # OTS_LISTENER_PORT; update them if fullnameOverride or a different
  # release name is used.
  plugins:
    extra:
      - rabbitmq_mqtt
      - rabbitmq_auth_backend_http
  config:
    extra: |
      deprecated_features.permit.transient_nonexcl_queues = true
      management.load_definitions = /etc/rabbitmq/definitions/definitions.json
      mqtt.listeners.tcp.default = 1883
      auth_backends.1 = internal
      auth_backends.2 = http
      auth_http.http_method = post
      auth_http.user_path = http://opentakserver-web:8081/api/rabbitmq/auth
      auth_http.vhost_path = http://opentakserver-web:8081/api/rabbitmq/vhost
      auth_http.resource_path = http://opentakserver-web:8081/api/rabbitmq/resource
      auth_http.topic_path = http://opentakserver-web:8081/api/rabbitmq/topic
  service:
    extraPorts:
      - name: mqtt
        port: 1883
        targetPort: 1883
        protocol: TCP
  singleNode:
    persistence:
      enabled: false
  # NOTE: secretName must match the rendered name of the
  # rabbitmq-definitions Secret ("<release fullname>-rabbitmq-definitions").
  # If fullnameOverride or a different release name is used, update this.
  extraVolumes:
    - name: opentakserver-rabbitmq-definitions
      secret:
        secretName: opentakserver-rabbitmq-definitions
  extraVolumeMounts:
    - name: opentakserver-rabbitmq-definitions
      mountPath: /etc/rabbitmq/definitions
      readOnly: true
  external:
    host: ""
    port: 5672
    username: guest
    password: guest
    vhost: /
    existingSecret:
      name: ""
      keys:
        host: host
        port: port
        username: username
        password: password
        vhost: vhost
